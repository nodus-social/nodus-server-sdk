[package]
name = "nodus-federation"
description = "ActivityPub federation: activities, HTTP signatures, delivery and inbox policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
native = ["dep:reqwest"]
crypto = ["dep:rsa", "dep:sha2", "dep:base64"]

[dependencies]
nodus-activitypub-core = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rsa = { version = "0.9", features = ["sha2"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[lints]
workspace = true
