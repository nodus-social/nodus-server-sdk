[workspace]
resolver = "2"
members = [
    "crates/activitypub",
    "crates/activitypub-core",
    "crates/activitypub-client",
    "crates/federation",
    "crates/extensions/mastodon",
    "crates/extensions/nodus",
    "crates/service",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/nodus-social/nodus-server-sdk"

[workspace.dependencies]
nodus-activitypub-sdk = { path = "crates/activitypub", version = "0.1.0" }
nodus-activitypub-core = { path = "crates/activitypub-core", version = "0.1.0" }
nodus-activitypub-client = { path = "crates/activitypub-client", version = "0.1.0" }
nodus-federation = { path = "crates/federation", version = "0.1.0" }
nodus-mastodon-sdk = { path = "crates/extensions/mastodon", version = "0.1.0" }
nodus-performance-sdk = { path = "crates/extensions/nodus", version = "0.1.0" }
nodus-server-sdk = { path = "crates/server", version = "0.1.0" }
nodus-service-sdk = { path = "crates/service", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
